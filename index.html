<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>沖繩 8天7夜自駕行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132A2E;
    --sea:#0C4F55;
    --sea-deep:#082F34;
    --sea-tint:#E4F0EE;
    --coral:#E2603D;
    --coral-tint:#FBE7DF;
    --gold:#D6A544;
    --sand:#F6F1E3;
    --paper:#FFFDF8;
    --line:#DDD4C0;
    --muted:#6E7E7C;
    --radius-s:10px;
    --radius-m:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans TC', sans-serif;
    background:var(--sand);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  h1,h2,h3,.serif{font-family:'Noto Serif TC', serif;}

  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 40px rgba(8,47,52,0.08);
  }

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(160deg, var(--sea-deep), var(--sea) 75%);
    color:#fff;
    padding:22px 20px 16px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header .eyebrow{
    font-size:12px;
    letter-spacing:.06em;
    color:#BFE0DB;
    margin:0 0 4px;
  }
  header h1{
    font-size:22px;
    line-height:1.3;
    margin:0 0 2px;
    font-weight:700;
  }
  header .sub{
    font-size:12.5px;
    color:#CFE7E3;
    margin:0;
  }
  .wave{
    position:absolute; left:0; right:0; bottom:-1px; height:14px;
    background:var(--paper);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    transform:scaleX(1.4);
  }

  /* day chip scroller (only on itinerary tab) */
  .day-scroller{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 20px 0;
    scrollbar-width:none;
  }
  .day-scroller::-webkit-scrollbar{display:none;}
  .day-chip{
    flex:0 0 auto;
    padding:7px 13px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    color:#EAF4F2;
    font-size:12.5px;
    font-weight:600;
    border:1px solid rgba(255,255,255,.18);
    cursor:pointer;
    white-space:nowrap;
  }
  .day-chip.active{
    background:var(--coral);
    border-color:var(--coral);
    color:#fff;
  }
  .day-chip .dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--gold); margin-right:5px; vertical-align:middle;
  }

  /* ---------- Content ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:18px 18px 90px;
  }
  section.panel{display:none;}
  section.panel.active{display:block; animation:fadeUp .32s ease both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .day-head{
    margin-bottom:14px;
  }
  .day-head h2{
    font-size:19px;
    margin:0 0 3px;
    color:var(--sea-deep);
  }
  .day-head .date-line{
    font-size:12.5px;
    color:var(--muted);
  }
  .callout{
    background:var(--coral-tint);
    border-left:3px solid var(--coral);
    padding:9px 12px;
    border-radius:0 8px 8px 0;
    font-size:12.5px;
    color:#7A3520;
    margin:10px 0 16px;
    line-height:1.5;
  }
  .callout.good{
    background:var(--sea-tint);
    border-left-color:var(--sea);
    color:var(--sea-deep);
  }

  /* timeline */
  .timeline{
    position:relative;
    padding-left:20px;
  }
  .timeline::before{
    content:"";
    position:absolute;
    left:5px; top:6px; bottom:6px;
    width:1.5px;
    background:var(--line);
  }
  .item{
    position:relative;
    padding-bottom:20px;
  }
  .item:last-child{padding-bottom:0;}
  .item::before{
    content:"";
    position:absolute;
    left:-19px; top:5px;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--sea);
    border:2px solid var(--paper);
    box-shadow:0 0 0 1.5px var(--sea);
  }
  .item.meal::before{background:var(--coral); box-shadow:0 0 0 1.5px var(--coral);}
  .item.highlight::before{background:var(--gold); box-shadow:0 0 0 1.5px var(--gold);}

  .item .time{
    font-size:11.5px;
    font-weight:700;
    color:var(--sea);
    letter-spacing:.02em;
  }
  .item.meal .time{color:var(--coral);}
  .item.highlight .time{color:#A87A16;}

  .item .card{
    margin-top:4px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius-s);
    padding:11px 12px;
  }
  .item .title{
    font-size:14.5px;
    font-weight:700;
    margin:0 0 3px;
    color:var(--ink);
  }
  .item .meta{
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
  }
  .item .meta b{color:var(--ink); font-weight:600;}
  .item .note{
    margin-top:6px;
    font-size:11.5px;
    background:#FFF6E8;
    color:#8A5A00;
    border-radius:6px;
    padding:5px 8px;
    line-height:1.5;
  }
  .row-btns{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .map-btn{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12px; font-weight:600;
    color:#fff; background:var(--sea);
    padding:6px 11px; border-radius:999px;
    text-decoration:none;
    border:none;
  }
  .map-btn svg{width:12px; height:12px;}
  .drive-link{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:var(--muted);
    margin:6px 0 0 -20px; padding-left:20px;
  }

  /* ---------- Transport tab ---------- */
  .card-block{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius-m);
    padding:14px 15px; margin-bottom:14px;
  }
  .card-block h3{font-size:15px; margin:0 0 8px; color:var(--sea-deep);}
  .kv{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv span:first-child{color:var(--muted);}
  .kv span:last-child{font-weight:600; text-align:right; max-width:60%;}

  .drive-table{width:100%; border-collapse:collapse; font-size:12px;}
  .drive-table th{
    text-align:left; color:var(--muted); font-weight:600;
    padding:5px 4px; border-bottom:1px solid var(--line);
  }
  .drive-table td{padding:6px 4px; border-bottom:1px solid #EFE9D8;}
  .drive-table td.time{color:var(--sea); font-weight:700; white-space:nowrap;}

  /* ---------- Accommodation ---------- */
  .hotel-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius-m);
    overflow:hidden; margin-bottom:16px;
  }
  .hotel-card .top{
    background:linear-gradient(120deg, var(--sea), var(--sea-deep));
    color:#fff; padding:13px 15px;
  }
  .hotel-card .top .nights{
    font-size:11px; color:var(--gold); font-weight:700; letter-spacing:.03em;
  }
  .hotel-card .top h3{margin:3px 0 0; font-size:16px;}
  .hotel-card .body{padding:12px 15px;}

  .badge{
    display:inline-block; font-size:11px; font-weight:700; padding:2px 8px;
    border-radius:999px; margin-right:6px;
  }
  .badge.yes{background:#E1F2E0; color:#25702B;}
  .badge.no{background:#F3E4E1; color:#93372A;}

  /* ---------- Packing ---------- */
  .checklist{list-style:none; padding:0; margin:0;}
  .checklist li{
    display:flex; align-items:flex-start; gap:9px;
    font-size:13px; padding:9px 0; border-bottom:1px solid #EFE9D8;
  }
  .checklist li:last-child{border-bottom:none;}
  .checklist input[type=checkbox]{
    margin-top:2px; width:16px; height:16px; accent-color:var(--sea); flex:0 0 auto;
  }
  .checklist label{cursor:pointer;}

  .info-item{margin-bottom:12px;}
  .info-item .k{font-size:12.5px; font-weight:700; color:var(--sea-deep); margin-bottom:2px;}
  .info-item .v{font-size:12.5px; color:var(--ink); line-height:1.6;}

  /* ---------- Budget ---------- */
  .total-box{
    background:linear-gradient(135deg, var(--sea-deep), var(--sea));
    color:#fff; border-radius:var(--radius-m); padding:18px 16px; margin-bottom:16px;
    text-align:center;
  }
  .total-box .label{font-size:12px; color:#BFE0DB;}
  .total-box .num{font-size:30px; font-weight:900; font-family:'Noto Serif TC',serif; margin:2px 0;}
  .total-box .cap{font-size:11.5px; color:#CFE7E3;}

  .bar-row{margin-bottom:11px;}
  .bar-row .bar-label{
    display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;
  }
  .bar-row .bar-label b{font-weight:700;}
  .bar-track{height:8px; background:var(--sea-tint); border-radius:999px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--coral); border-radius:999px;}

  .day-cost-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; padding:8px 0; border-bottom:1px solid #EFE9D8;
  }
  .day-cost-row:last-child{border-bottom:none;}
  .day-cost-row .d{color:var(--muted);}
  .day-cost-row .amt{font-weight:700; color:var(--sea-deep);}

  /* ---------- Bottom nav ---------- */
  nav.bottom{
    position:sticky; bottom:0; left:0; right:0;
    background:#fff;
    border-top:1px solid var(--line);
    display:flex;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index:30;
  }
  nav.bottom button{
    flex:1; background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 2px; color:var(--muted); font-family:inherit;
  }
  nav.bottom button svg{width:20px; height:20px; stroke:var(--muted); fill:none; stroke-width:1.8;}
  nav.bottom button span{font-size:10.5px; font-weight:600;}
  nav.bottom button.active{color:var(--sea);}
  nav.bottom button.active svg{stroke:var(--sea);}

  ::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>

  </nav>

</div>

function renderItinerary(){
  const scroller = document.getElementById('dayScroller');
  scroller.innerHTML = days.map(d=>
    `<div class="day-chip ${d.n===1?'active':''}" data-day="${d.n}"><span class="dot"></span>Day ${d.n}</div>`
  ).join('');

  const panel = document.getElementById('panel-itinerary');
  panel.innerHTML = days.map(d=>`
    <div class="day-view" id="day-${d.n}" style="${d.n===1?'':'display:none;'}">
      <div class="day-head">
        <h2>Day ${d.n}・${d.title}</h2>
        <div class="date-line">${d.date}</div>
      </div>
      ${d.callout ? `<div class="callout ${d.callout.good?'good':''}">${d.callout.text}</div>` : ''}
      <div class="timeline">
        ${d.items.map(it=>`
          <div class="item ${it.ty}">
            <div class="time">${it.t}</div>
            <div class="card">
              <p class="title">${it.title}</p>
              ${it.meta ? `<p class="meta">${it.meta}</p>` : ''}
              ${it.note ? `<div class="note">${it.note}</div>` : ''}
              ${it.map ? `<div class="row-btns"><a class="map-btn" href="${it.map}" target="_blank" rel="noopener">${iconMap}導航</a></div>` : ''}
            </div>
            ${it.drive ? `<div class="drive-link">🚗 ${it.drive}</div>` : ''}
          </div>
        `).join('')}
      </div>
      <div class="card-block" style="margin-top:16px;">
        <div class="kv"><span>本日預估花費</span><span>${d.cost}</span></div>
      </div>
    </div>
  `).join('');

  scroller.addEventListener('click', e=>{
    const chip = e.target.closest('.day-chip');
    if(!chip) return;
    const n = chip.dataset.day;
    document.querySelectorAll('.day-chip').forEach(c=>c.classList.toggle('active', c===chip));
    document.querySelectorAll('.day-view').forEach(v=> v.style.display = (v.id===`day-${n}` ? '' : 'none'));
    const d = days.find(x=>String(x.n)===n);
    document.getElementById('headerSub').textContent = `Day ${d.n} · ${d.date} ${d.title}`;
    document.getElementById('main').scrollTop = 0;
  });
}

function initNav(){
  const buttons = document.querySelectorAll('#bottomNav button');
  const titles = {
    itinerary:['沖繩 8天7夜行程','Day 1 · 9/20（日）抵達沖繩・那霸市區'],
    transport:['交通 & 停車','租車資訊・停車策略・每日駕車時間'],
    hotel:['住宿一覽','3間飯店・那霸 → 北部 → 那霸'],
    pack:['行李 & 實用資訊','出發前打勾確認・保險・網路'],
    budget:['預算總覽','HKD 8,000（不含機票/酒店/租車）'],
  };
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      buttons.forEach(b=>b.classList.toggle('active', b===btn));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      const tab = btn.dataset.tab;
      document.getElementById(`panel-${tab}`).classList.add('active');
      document.getElementById('dayScroller').style.display = tab==='itinerary' ? 'flex' : 'none';
      document.getElementById('headerTitle').textContent = titles[tab][0];
      document.getElementById('headerSub').textContent = titles[tab][1];
      document.getElementById('main').scrollTop = 0;
    });
  });
}
